[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fgos"
version = "0.1.0"
description = "FGOS — FAT Tech Growth Operacional System. Event-driven platform for productivity, social/ads, messaging+AI, CRM, and BI for marketing agencies."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{ name = "Walfredo Figueiredo Neto", email = "walfredonetto@gmail.com" }]
dependencies = [
    "asyncpg>=0.29",
    "clickhouse-connect>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/ShunWalChin/FGOS"
"FAT Tech" = "https://fattech.com.br"

[project.scripts]
fgos = "core_engine.cli:cli"
core-engine = "core_engine.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
