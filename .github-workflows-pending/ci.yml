# FGOS CI — lint + tests + secret scan
#
# NOTA: este arquivo vive em .github-workflows-pending/ porque o token gh atual
# não tem o scope `workflow`. Para ativar (uma vez):
#   gh auth refresh -h github.com -s workflow
#   git mv .github-workflows-pending .github/workflows
#   git add -A && git commit -m "ci: activate workflows" && git push

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Compile
        run: python -m compileall src

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
